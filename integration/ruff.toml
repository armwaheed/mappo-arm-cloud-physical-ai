#
# Lint settings for integration/. Deliberately identical to robot-stack's visual_nav
# config, because these two directories are read together and a second style would be
# noise. Scoped here rather than at the root for the same reason it is scoped there.
#
#   ruff check .                                    # this config
#   ruff check . --select E722,E731,C901,PLR0911,PLR0912,PLR0913,PLR0915   # SE pass
line-length = 100

# The robot's Jetson runs Python 3.8 (Ubuntu 20.04 / JetPack 5). That matters here and
# not only in the robot stack: `mappo_bridge` is what a LIVE integration would import on
# the robot, beside the control loop. `replay_mappo` and the tests only ever run on a
# workstation, but splitting the target by file would be a trap the first time a helper
# moved between them.
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[lint.per-file-ignores]
# The runnable entry point and the tests put this directory on sys.path before importing
# their siblings, so their imports genuinely are not at the top of the file.
"replay_mappo.py" = ["E402"]
"test_*.py" = ["E402"]
