#
# Deliberately identical to integration/ruff.toml and robot-stack's visual_nav config.
# Three directories in one repository with three house styles is noise, and this one is
# read side by side with integration/.
#
#   ruff check .                                    # this config
#   ruff check . --select E722,E731,C901,PLR0911,PLR0912,PLR0913,PLR0915   # SE pass
line-length = 100

# The Go2's Jetson runs Python 3.8 (Ubuntu 20.04 / JetPack 5) and this package is
# imported there, beside the control loop.
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[lint.per-file-ignores]
# Both put this directory on sys.path before importing the package under test.
"basic_test.py" = ["E402"]
"test_*.py" = ["E402"]
