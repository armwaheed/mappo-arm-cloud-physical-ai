# Packaging for the arm-mhs-unitree-go2 MHS driver.
#
# Two rules for any MHS vendor driver package (see the quickstart-resources
# vendor-connector-template in modelhardwarestandard/quickstart-resources):
#
#   1. Depend on the shared robot-agnostic core "arm-mhs-robotkit", which in turn depends on "mhs"
#      (unpinned). The bare dependency installs the wire tier plus the SDK's base dependencies
#      (pyyaml, pynacl, pydantic) -- it never drags shared-memory libraries (cffi, numpy) or broker
#      clients onto a device.
#   2. Do not hard-code a transport. Which broker the lab runs is the lab's choice, not the
#      driver's. Forward the choice through optional extras instead.
#
# NOTE: pre-launch, the `mhs` package is not yet on PyPI. Until the first mhs release, install the
# SDK editable from a clone -- `pip install -e "modelhardwarestandard/python-sdk[wire,nats]"` -- then
# `pip install -e ../arm-mhs-robotkit` and `pip install -e .` here, and run the drivers as scripts
# (see README.md). This package becomes pip-installable at that release.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-mhs-unitree-go2"
version = "0.1.0"
description = "MHS driver and on-robot control stack for the Unitree Go2 quadruped and its D1 servo arm. Built on the shared arm-mhs-robotkit core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arm-mhs-robotkit",
]

[project.optional-dependencies]
# Transport selection forwards to mhs's own extras, so the deployment picks the broker at install:
#     pip install "arm-mhs-unitree-go2[nats]"
nats = ["mhs[wire,nats]"]
mqtt = ["mhs[wire,mqtt]"]
zenoh = ["mhs[wire,zenoh]"]

[project.scripts]
go2-agent = "go2.go2_agent:main"

# The driver package lives at driver/go2. Before publishing to a public index, give it a
# package-unique namespace so it cannot collide with another top-level module in site-packages (the
# vendor-connector-template flags the same).
[tool.setuptools]
packages = ["go2"]

[tool.setuptools.package-dir]
go2 = "driver/go2"
