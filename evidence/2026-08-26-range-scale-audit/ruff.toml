#
# Lint settings for this evidence directory. Same selection and line length as
# evidence/2026-08-26-ranging-without-a-size-prior/ruff.toml, which is the precedent.
#
#   cd evidence/2026-08-26-range-scale-audit && ruff check .
#
# E402 is exempted for one file and one reason: scale_audit.py imports the shipped
# `camera_model` and `colour_detector` rather than reimplementing them, so it has to put
# visual_nav on sys.path before the import. `ruff --fix` will hoist that import above the
# sys.path line and break it; re-run the script after any lint fix.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[lint.per-file-ignores]
"scale_audit.py" = ["E402"]
