#
# Lint settings for this evidence directory. Same selection and line length as
# evidence/2026-08-26-detector-input-size/ruff.toml, which this directory continues.
#
#   cd evidence/2026-08-27-one-robot-four-detectors && ruff check .
#
# AGENTS.md records eight directories that no ruff.toml covers and says CI fails if a
# ninth appears. This file is why this directory is not the ninth.
#
# NO per-file-ignores. report.py reads committed JSON and imports nothing outside the
# standard library -- no `sys.path.insert`, so the E402 exemption other directories carry
# would be a rule that can never fire here. The scoring itself is not in this directory:
# it is detector/score_crossday.py, linted by detector/ruff.toml, because a scorer that
# lives in an evidence directory is a scorer the next measurement will copy.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
