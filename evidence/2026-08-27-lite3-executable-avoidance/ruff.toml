#
# Lint settings for this evidence directory. Same selection and line length as
# evidence/2026-08-26-no-open-bearing/ruff.toml, which is the precedent.
#
#   cd evidence/2026-08-27-lite3-executable-avoidance && ruff check .
#
# E402 is exempted for one file and one reason: replay_with_supervisor.py imports the
# shipped planner and policy rather than reimplementing them, so it has to put
# integration/ and visual_nav on sys.path before the import. `ruff --fix` will hoist
# that import above the sys.path line and break it; re-run the script after any lint
# fix.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[lint.per-file-ignores]
"replay_with_supervisor.py" = ["E402"]
