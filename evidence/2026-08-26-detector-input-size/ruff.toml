#
# Lint settings for this evidence directory. Same selection and line length as
# evidence/2026-08-25-peer-runs/ruff.toml, which is the precedent for linting an
# evidence run's tooling rather than leaving it uncovered.
#
#   cd evidence/2026-08-26-detector-input-size && ruff check .
#
# AGENTS.md records eight directories that no ruff.toml covers and says CI fails if a
# ninth appears. This file is why this directory is not the ninth.
#
# NO per-file-ignores. reproduce.py has no `sys.path.insert`, so the E402 exemption the
# expansion directory carries would be a rule that can never fire here. `cv2` and `numpy`
# are imported inside the two functions that need them -- deliberately, so the live half
# of the script runs on a machine with neither -- and that is a PLC0415 concern, which
# this selection does not include and which the surrounding directories do not select.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
