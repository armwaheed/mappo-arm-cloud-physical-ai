#
# Lint settings for this evidence directory. Same selection and line length as
# evidence/2026-08-26-detector-input-size/ruff.toml, which is the precedent for linting
# an evidence run's tooling rather than leaving it uncovered.
#
#   cd evidence/2026-08-27-89-runs-survived-14-can-be-dated && ruff check .
#
# AGENTS.md records eight directories that no ruff.toml covers and says CI fails if a
# ninth appears. This file is why this directory is not the ninth.
#
# NO per-file-ignores. Neither script has a `sys.path.insert` and neither imports from a
# sibling, so the E402 exemption the expansion directory carries could never fire here.
#
# inventory.py imports only the standard library -- deliberately, so the inventory can be
# regenerated on the 3.8 leg and on a machine with neither cv2 nor numpy installed.
# rescore.py needs cv2 and imports it inside the two functions that use it, matching
# evidence/2026-08-26-detector-input-size/reproduce.py. That is a PLC0415 concern, which
# this selection does not include and which the surrounding directories do not select.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
