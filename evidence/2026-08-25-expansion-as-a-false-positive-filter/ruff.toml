#
# Lint settings for this evidence directory. Same selection and line length as
# unitree/go2/visual_nav, which is what these scripts import.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[lint.per-file-ignores]
# Every script here has to put visual_nav on sys.path before importing from it, so
# those imports genuinely are not at the top of the file. Same idiom as the repo's
# test modules.
"*.py" = ["E402"]
