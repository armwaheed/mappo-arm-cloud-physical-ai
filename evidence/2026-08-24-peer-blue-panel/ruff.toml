#
# Lint settings for this evidence directory. Same selection and line length as
# evidence/2026-08-25-expansion-as-a-false-positive-filter/ruff.toml, which is the precedent
# for linting an evidence run's tooling rather than leaving it uncovered.
#
#   cd evidence/2026-08-24-peer-blue-panel && ruff check .
#
# check_blue_patch.py was already clean under this selection before this file was added
# (measured 2026-08-26 at 3c23299, ruff 0.15.21), so nothing here was rewritten to make a
# gate green. This directory was one of the twelve CI could previously only warn about.
#
# NO per-file-ignores, unlike the expansion directory's config. The one import below the
# `sys.path.insert` here already carries its own `# noqa: E402`, so `"*.py" = ["E402"]`
# would silence nothing and would make that noqa redundant — RUF100, red, for adding an
# exemption that was not needed.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
