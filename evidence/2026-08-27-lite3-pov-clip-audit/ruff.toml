#
# Lint settings for this evidence directory. Same selection and line length as
# evidence/2026-08-25-peer-runs/ruff.toml, which is the precedent for linting an evidence
# run's tooling rather than leaving it uncovered.
#
#   cd evidence/2026-08-27-lite3-pov-clip-audit && ruff check .
#
# CI's ratchet at .github/workflows/offline-checks.yml counts directories holding Python
# that no ruff.toml covers, and fails when a ninth appears. A new evidence directory with
# .py in it and no config would be that ninth, so this file is not optional.
#
# NO per-file-ignores. Every script here puts its imports in one block at the top and none
# of them needs a `sys.path.insert`, so an E402 exemption would be a rule that can never
# fire -- and this repository has already shipped one gate that could never fail.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
