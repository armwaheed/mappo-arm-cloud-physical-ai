#
# The first CI this repository has had. It runs everything that does not need a robot:
# the naming embargo, the ruff configs, and every offline test suite. Nothing here talks
# to DDS, opens a camera, or moves a leg.
#
# WHAT IT IS FOR. Twenty PRs merged on hand measurement alone, and hand measurement missed
# four things that this file exists to make impossible:
#
#   1. A PR reported "ruff clean" having run one directory's config against a different
#      directory's code. The lint loop below therefore derives its directory list FROM THE
#      ruff.toml FILES THEMSELVES, so a directory and the config it is linted against are
#      paired by construction rather than by whoever wrote the command.
#   2. AGENTS.md named one test file by name in a directory that holds ten, so the nine
#      siblings were never run by the documented command. Every loop here globs.
#   3. A suite that dies at ModuleNotFoundError printed nothing anybody read. Skips are
#      announced as ::warning:: annotations, which land on the run summary rather than on
#      line 400 of a collapsed log.
#   4. A forbidden name reached the tree by being copied in from an upstream repository and
#      nothing detected it. The `naming` job below greps for it — see that job's comment.
#
# AND TWO THINGS THIS FILE ITSELF GOT WRONG, FIXED HERE:
#
#   5. It made AGENTS.md carry the per-directory test counts and re-measured them there,
#      which turned the file every agent edits into a merge conflict on every change that
#      added a test. Two collided on it in one night. The counts are generated into
#      .github/test-inventory.tsv now, by .github/measure-suites.sh — the same script a
#      person runs, because a generated file nobody can regenerate is worse than the
#      hand-typed one it replaced. The enforcement did not move: the `docs` job checks the
#      documented suites against that file, and `suites` re-measures the file itself.
#   6. Its lint loop pinned each directory to its own config and stopped there. It does not
#      pin the ANSWER: ruff anchors isort's `src` at the directory you are STANDING IN when
#      a config is given with `--config`, so one config file returns opposite verdicts about
#      the same module from two directories — eight I001 findings from inside
#      detector/labels/pipeline/ that neither documented command produces. The loop above
#      uses discovery and never saw them. Every config is now run from every directory it
#      governs and the answers must agree.
#
# AND WHAT ITS SIBLING GOT WRONG. The only other CI in this family — the offline checks in
# the upstream Go2 driver repository — walked a hard-coded `unitree/go2/*/` glob, which
# silently excluded a whole top-level directory including a test suite. Its own "this
# directory has no ruff.toml" warning was scoped to the same glob, so the warning that
# existed to catch the omission could never fire for it. That was fixed there; this file
# inherits the fixed version, not the original. Nothing below is scoped to a prefix. If
# you find yourself adding one, you are re-introducing that bug.

name: offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------
  naming:
    name: naming embargo
    runs-on: ubuntu-22.04
    # AGENTS.md's Naming section is absolute: no earlier internal name for Arm Device
    # Connect and no originating company name may appear anywhere in this repository —
    # code, comments, docs, filenames, branch names, commit messages, or PR text. The
    # repository is shared with Deep Robotics and with Arm's China teams BEFORE the
    # standard launches publicly, which is why it is a rule and not a style preference.
    #
    # THE PATTERNS ARE WRITTEN AS CHARACTER CLASSES ON PURPOSE. This file is inside the
    # tree it greps. Spelling a forbidden string here would make the check fail on itself
    # forever, and would put the string in the repository — which is the thing being
    # forbidden. `[Mm][Hh][Ss]` matches the abbreviation without containing it.
    #
    # A GREP THAT CANNOT MATCH IS A GATE THAT NEVER FIRES, so the step below builds each
    # forbidden string from parts at run time and asserts the pattern finds it, and builds
    # two near-misses and asserts it does not. Without that, a typo in a character class
    # would leave a green tick over a check that had stopped checking.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commit messages in this PR's range are in scope

      - name: No forbidden name in the tree, the paths, this branch, or its commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # GitHub runs every `run:` block as `bash -e -o pipefail`. Half the commands
          # below are expected to exit non-zero in the GOOD case — a grep that finds no
          # forbidden name, a `grep -c` that counts none — so -e is turned off here and
          # every status is handled explicitly. Leaving it on made this step exit 1 with
          # no output at all on its first real run, before it had checked anything.
          set +e
          set -uo pipefail

          # Underscore is a word character to grep -E, so \b will not separate a_bbr_b.
          # Both patterns therefore spell the separator out as "not alphanumeric".
          ABBR='(^|[^A-Za-z0-9])[Mm][Hh][Ss]([^A-Za-z0-9]|$)'
          PHRASE='[Mm]odel[^A-Za-z0-9]{0,2}[Hh]ardware[^A-Za-z0-9]{0,2}[Ss]tandard'
          # A leading boundary only: "philanthropic" and "misanthropic" must not match,
          # but a trailing "...ic.com" or "...ics" must.
          ORIGIN='(^|[^A-Za-z])[Aa]nthropic'
          PATTERN="$ABBR|$PHRASE|$ORIGIN"

          # ---- positive and negative controls -------------------------------------
          fail=0
          probe_abbr="$(printf 'arm-%s%s%s-unitree-go2' m h s)"
          probe_phrase="$(printf '%sodel%sardware%standard' M H S)"
          probe_origin="$(printf '%sn%sropic' A th)"
          for probe in "$probe_abbr" "$probe_phrase" "$probe_origin"; do
            if ! printf '%s\n' "$probe" | grep -qE "$PATTERN"; then
              echo "::error::the embargo pattern no longer matches a string it must match"
              fail=1
            fi
          done
          for near in philanthropic misanthropic "the standard" "hardware model"; do
            if printf '%s\n' "$near" | grep -qE "$PATTERN"; then
              echo "::error::the embargo pattern matches '$near', which is not forbidden"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::self-test failed — fix the pattern before trusting this job"
            exit 1
          fi
          echo "self-test: pattern matches all 3 forbidden forms and none of 4 near-misses"

          status=0

          # ---- 1. file contents ----------------------------------------------------
          # -I so a JPEG that happens to contain the bytes is not a finding. Only the
          # location is printed, never the match: this log is a public artefact too.
          hits="$(grep -rInE "$PATTERN" --exclude-dir=.git . 2>/dev/null)"
          if [ -n "$hits" ]; then
            while IFS= read -r hit; do
              file="${hit%%:*}"; rest="${hit#*:}"; line="${rest%%:*}"
              echo "::error file=${file#./},line=${line}::AGENTS.md Naming: a forbidden name appears on this line. Re-run the greps in .github/workflows/offline-checks.yml locally to see it."
            done <<< "$hits"
            echo "$(printf '%s\n' "$hits" | wc -l | tr -d " ") occurrence(s) in tracked content"
            status=1
          fi

          # ---- 2. paths ------------------------------------------------------------
          paths="$(git ls-files | grep -E "$PATTERN")"
          if [ -n "$paths" ]; then
            while IFS= read -r p; do
              echo "::error file=${p}::AGENTS.md Naming: this path contains a forbidden name"
            done <<< "$paths"
            status=1
          fi

          # ---- 3. commit messages, SCOPED TO THIS CHANGE ---------------------------
          # Deliberately not `git log --all`. main already carries one occurrence, in the
          # squash message of the very PR that removed the name from the tree: that PR
          # verified "the history grep returns 0" before it wrote the message that made it
          # 1. It cannot be removed without rewriting history already shared with Deep
          # Robotics, so a whole-history gate would be permanently red and un-fixable,
          # and a permanently red gate gets ignored. Scoping to the pushed range keeps the
          # rule enforceable where it can still be obeyed: on the commits being added.
          range=""
          if [ -n "${BASE_SHA:-}" ]; then
            range="${BASE_SHA}..HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..HEAD"
          fi
          if [ -n "$range" ] && git rev-list "$range" >/dev/null 2>&1; then
            n_commits="$(git rev-list --count "$range")"
            for sha in $(git rev-list "$range"); do
              if git log -1 --format='%B%n%an%n%ae' "$sha" | grep -qE "$PATTERN"; then
                echo "::error::commit ${sha} has a forbidden name in its message or author"
                status=1
              fi
            done
            echo "checked $n_commits commit message(s) in $range"
          else
            echo "::warning::no commit range for this event — commit messages were not checked"
          fi

          # ---- 4. branch name and PR text ------------------------------------------
          for pair in "branch name|${HEAD_REF:-}" "PR title|${PR_TITLE:-}" "PR body|${PR_BODY:-}"; do
            what="${pair%%|*}"; value="${pair#*|}"
            [ -z "$value" ] && continue
            if printf '%s\n' "$value" | grep -qE "$PATTERN"; then
              echo "::error::the $what contains a forbidden name"
              status=1
            fi
          done

          if [ "$status" -eq 0 ]; then
            echo "clean: tree, paths, commit messages, branch name, PR title and body"
          else
            echo "::error::AGENTS.md Naming is absolute. Remove the name and say so in the PR."
          fi
          exit $status

  # ---------------------------------------------------------------------------------
  lint:
    name: ruff
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PINNED. ruff is the one tool here whose verdict can change without anybody
      # touching this repository: a new release adds rules and reddens an unrelated PR.
      # Bumping it should be its own change, with the findings in the body. The version
      # of the INTERPRETER is irrelevant to the verdict — every ruff.toml in this tree
      # sets `target-version = "py38"` itself, so ruff lints for the robot's Python no
      # matter what runs it.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check --quiet "ruff==0.15.21"

      - name: Shellcheck the scripts this workflow runs
        # .github/measure-suites.sh is the single implementation of "run every suite and
        # count the `  ok  ` lines" — the copy CI runs and the copy a person runs are the
        # same file, which is the whole reason the generated inventory is trustworthy. It
        # is also the only file here that no ruff.toml can cover, so it gets the linter for
        # its own language rather than none.
        #
        # PINNED, for the reason ruff is pinned: a new shellcheck adds checks and reddens
        # an unrelated pull request. Installed from PyPI rather than used from the runner
        # image so that the version is stated here and not inherited from ubuntu-22.04.
        #
        # DEFAULT SEVERITY, not `-o all`. The optional checks want ${braces} and [[ ]]
        # everywhere, which would put the script in a different style from every `run:`
        # block in this file. Clean at default severity with shellcheck 0.11.0.
        run: |
          python -m pip install --disable-pip-version-check --quiet "shellcheck-py==0.11.0.1"
          # find, not ls: a glob that matches nothing would be passed through literally and
          # shellcheck would fail on a filename — a red tick for the wrong reason. This
          # counts first, so "no scripts" is reported as "this step checked nothing".
          n="$(find .github -maxdepth 1 -name '*.sh' | wc -l | tr -d ' ')"
          if [ "$n" -eq 0 ]; then
            echo "::error::no .sh found under .github/ — this step is checking nothing"
            exit 1
          fi
          shellcheck .github/*.sh
          echo "shellcheck: $n script(s) clean"

      - name: Lint each directory from inside itself, against its own config
        # THE DISCOVERY IS THE FIX. A PR reported "ruff clean" after running
        # integration/ruff.toml against robot-stack/unitree/go2/visual_nav/ and shipped 13
        # findings. Deriving the list from `find . -name ruff.toml` makes that combination
        # unrepresentable: the directory linted is the directory the config lives in.
        # `ruff check .` from inside it is exactly the command AGENTS.md documents.
        run: |
          # bash -e is GitHub's default for `run:` blocks and the loops below rely on
          # commands that exit non-zero in the good case; statuses are handled explicitly.
          set +e
          set -uo pipefail
          status=0
          linted=0
          for config in $(find . -name ruff.toml -not -path './.git/*' | sort); do
            dir="$(dirname "$config")"
            # A config over no Python is a green tick that checked nothing.
            n_py="$(find "$dir" -name '*.py' -not -path '*/__pycache__/*' | wc -l | tr -d ' ')"
            if [ "$n_py" -eq 0 ]; then
              echo "::error file=${config#./}::this ruff.toml governs no .py files — it lints nothing"
              status=1
              continue
            fi
            echo "::group::ruff check . ($dir, $n_py files)"
            (cd "$dir" && ruff check .) || status=1
            echo "::endgroup::"
            linted=$((linted + 1))
          done
          if [ "$linted" -eq 0 ]; then
            echo "::error::no directory was linted — the discovery loop found nothing"
            exit 1
          fi
          echo "linted $linted directories"
          exit $status

      - name: A config must answer the same from every directory it governs
        # ONE CONFIG FILE, OPPOSITE VERDICTS. The step above pins a directory to its own
        # config. It does not pin the ANSWER, because ruff decides isort first-party-ness
        # from `src`, and `src` is anchored at the PROJECT ROOT — which under
        # `--config <path>` is THE DIRECTORY YOU ARE STANDING IN, not the directory the
        # config lives in. (Under plain discovery it is the config's own directory.
        # Measured with ruff 0.15.21: `--show-settings` prints
        # `linter.project_root = <cwd>` in the first case and `= <config dir>` in the
        # second.) A sibling module is therefore first-party from inside a subdirectory and
        # third-party from above it, and
        # `cd detector/labels/pipeline && ruff check . --config ../ruff.toml` reported
        # EIGHT I001 findings that neither documented command produced. Reproduced
        # 2026-08-26 against the config as it stood before #96 pinned the module by name.
        #
        # That is the #78 failure — a lint claim made against the wrong invocation context
        # — in a form that no amount of care about WHICH config to run would prevent, and
        # it is a verdict a human gets and CI does not, because the commands the configs
        # document use `--config` and the loop above uses discovery.
        #
        # So this step fixes the invocation rather than trusting it: every config is run
        # from the directory it lives in, from inside each subdirectory it governs, and
        # from the repository root, and the three runs must report the same findings.
        # `known-third-party` pins one module by name; this is what notices the next one.
        #
        # A GATE THAT CANNOT FIRE IS A GATE THAT NEVER FIRES. Before comparing anything
        # real, the step builds a two-directory tree that is KNOWN to answer differently
        # from two standpoints and asserts the comparison says so, then adds the one line
        # that fixes it and asserts the comparison goes quiet. Without those, a bug in the
        # path normalisation that made every comparison trivially equal would leave a green
        # tick over a check that had stopped checking.
        run: |
          # bash -e is GitHub's default for `run:` blocks and the loops below rely on
          # commands that exit non-zero in the good case; statuses are handled explicitly.
          set +e
          set -uo pipefail

          # findings <cwd> <config, relative to cwd> <target, relative to cwd>
          # -> "path:line:col: CODE ..." per finding, paths made relative to the target so
          #    that two standpoints are comparable, sorted so that order is not a finding.
          #    The "Found N errors" summary is dropped: it is the same information counted,
          #    and its wording differs between a clean run and a dirty one.
          findings() {
            ( cd "$1" && ruff check "$3" --config "$2" --output-format concise --no-cache 2>&1 ) \
              | awk -v pre="$3/" '
                  { line = $0
                    if (pre != "./" && index(line, pre) == 1) line = substr(line, length(pre) + 1)
                    if (line ~ /^[^ ].*:[0-9]+:[0-9]+: [A-Z]+[0-9]+/) print line }' \
              | sort
          }

          # ---- self-test: a tree that is known to diverge --------------------------------
          # sibling.py sits beside user.py inside sub/. Standing in sub/, it is first-party
          # and isort wants it in its own section; standing in the parent, it is third-party
          # and belongs in the block user.py already puts it in. Same config, both verdicts.
          P="$(mktemp -d)"
          mkdir -p "$P/sub"
          printf 'line-length = 100\ntarget-version = "py38"\n\n[lint]\nselect = ["I"]\n' > "$P/ruff.toml"
          printf 'VALUE = 1\n' > "$P/sub/sibling.py"
          printf 'import os\n\nimport numpy\nimport sibling\n\nprint(os, numpy, sibling.VALUE)\n' > "$P/sub/user.py"
          if [ "$(findings "$P" ruff.toml sub)" = "$(findings "$P/sub" ../ruff.toml .)" ]; then
            echo "::error::self-test: the comparison did not notice a config that is KNOWN to answer differently from two directories — it is not checking anything"
            rm -rf "$P"; exit 1
          fi
          printf '\n[lint.isort]\nknown-third-party = ["sibling"]\n' >> "$P/ruff.toml"
          if [ "$(findings "$P" ruff.toml sub)" != "$(findings "$P/sub" ../ruff.toml .)" ]; then
            echo "::error::self-test: the comparison reports a difference on a config that is KNOWN to answer the same from both directories — it would fail every pull request"
            rm -rf "$P"; exit 1
          fi
          rm -rf "$P"
          echo "self-test: the comparison catches a divergent config and clears a pinned one"

          # ---- the real pairs -------------------------------------------------------------
          # A subdirectory belongs to the NEAREST ruff.toml at or above it — the rule ruff
          # itself uses — so a subdirectory carrying its own config is not this one's
          # problem. Derived by globbing, never enumerated, for the same reason as the loop
          # above: a pair nobody wrote down still gets checked.
          status=0
          checked=0
          for config in $(find . -name ruff.toml -not -path './.git/*' | sort); do
            d="$(dirname "$config")"; d="${d#./}"
            for sub in $(find "$d" -type d -not -path '*/__pycache__/*' | sort); do
              sub="${sub#./}"
              [ "$sub" = "$d" ] && continue
              ls "$sub"/*.py >/dev/null 2>&1 || continue
              probe="$sub"; owner=""
              while [ "$probe" != "." ] && [ -n "$probe" ]; do
                if [ -f "$probe/ruff.toml" ]; then owner="$probe"; break; fi
                probe="$(dirname "$probe")"
              done
              [ "$owner" = "$d" ] || continue

              rel="${sub#"$d"/}"
              back="$(printf '%s\n' "$rel" | sed 's|[^/][^/]*|..|g')"
              from_config_dir="$(findings "$d" ruff.toml "$rel")"
              from_subdir="$(findings "$sub" "$back/ruff.toml" .)"
              from_root="$(findings . "$d/ruff.toml" "$sub")"
              checked=$((checked + 1))

              if [ "$from_config_dir" != "$from_subdir" ] || [ "$from_config_dir" != "$from_root" ]; then
                echo "::error file=$d/ruff.toml::this config answers differently about '$sub' depending on where it is invoked from. ruff anchors isort's src at the directory you are standing in; pin the module with [lint.isort] known-third-party, or known-first-party."
                echo "--- standing in $d          +++ standing in $sub"
                diff <(printf '%s\n' "$from_config_dir") <(printf '%s\n' "$from_subdir")
                echo "--- standing in $d          +++ standing in the repository root"
                diff <(printf '%s\n' "$from_config_dir") <(printf '%s\n' "$from_root")
                status=1
              fi
            done
          done
          if [ "$checked" -eq 0 ]; then
            # Not an error: it is a legitimate state for no config to have a Python-bearing
            # subdirectory. But an unannounced zero is how "this checked nothing" reads as
            # "this passed", so say which it is. The self-test above already proved the
            # comparison itself still works.
            echo "::warning::no ruff.toml governs a subdirectory that holds Python — there was nothing to compare"
          elif [ "$status" -eq 0 ]; then
            echo "$checked config/subdirectory pair(s) answered the same from all three standpoints"
          else
            # Never print the reassuring line on the way out of a failure: the count above
            # is how many pairs were CHECKED, not how many agreed.
            echo "::error::a ruff.toml answers differently depending on where it is invoked — of $checked pair(s) checked, at least one disagreed"
          fi
          exit $status

      - name: Report the Python that no config covers
        # Scoped to the WHOLE TREE, not to the directories linted above — that is the
        # sibling repository's exact bug, where the warning about unlinted directories was
        # scoped to the same glob that skipped them. A file is covered if any ancestor
        # directory inside the repo holds a ruff.toml; ruff resolves configs the same way.
        #
        # Warnings, not errors: adopting a config over a directory changes what is a
        # finding, and that is a judgement call for whoever owns the code, not for CI.
        # The RATCHET below is the compromise — today's are grandfathered, one more is not,
        # so the class can shrink but not grow while nobody is deciding.
        #
        # 13 when this workflow was written, 12 once #92 landed detector/ruff.toml, 8 now.
        # THE FOUR THAT WENT WERE THE FREE ONES. All twelve were measured on 2026-08-26 at
        # 3c23299 under the selection every other config in this repository carries
        # (E,W,F,I,UP,B,C4,SIM,RET,RUF, line-length 100, target py38), and that measurement
        # is the whole decision:
        #
        #   ADOPTED — already clean, so the config cost nothing but the file itself:
        #     deploy/demo                                    0   -> deploy/ruff.toml
        #     deploy/markers                                 0   -> deploy/ruff.toml
        #     evidence/2026-08-24-peer-blue-panel            0   -> its own
        #     evidence/2026-08-25-peer-runs                  0   -> its own
        #
        #   NOT ADOPTED — a config would be red on arrival, and the number is the price of
        #   adopting one. 41 findings across eight directories:
        #     robot-stack/unitree/go2/d1_arm                 8   F401 E501x2 SIM105 RUF002 RUF005 RUF046 RUF100
        #     robot-stack/unitree/go2/lidar_sight            7   F401x2 I001 RUF046x2 SIM105 RUF100
        #     robot-stack/unitree/go2/deploy                 5   I001x3 SIM105 RUF100
        #     robot-stack/unitree/go2/locomotion             4   I001 SIM105x2 RUF003
        #     robot-stack/unitree/go2/controller             3   I001 SIM105 RUF100
        #     evidence/2026-08-24-peer-capture-and-gait-sweeps/tools
        #                                                    9   I001x2 RUF010x4 C408x2 E702
        #     evidence/2026-08-14-first-policy-driven-walk   4   C408x2 RUF001 B007
        #     evidence/2026-08-19-what-the-policy-sees       1   I001
        #
        # NONE OF THE EIGHT IS VENDORED, GENERATED OR THIRD-PARTY — every file carries this
        # repository's own copyright header — so none is excluded on principle and this list
        # is debt with a price on it, not an exemption. Two things make it the owner's call
        # rather than this change's:
        #
        #   * Every I001 above was inspected with `ruff check --select I001 --diff` on
        #     2026-08-26 and none of them hoists an import above the `sys.path.insert` that
        #     makes it importable — that trap does not apply here. But the one in
        #     go2/deploy/go2_robot_io.py would DELETE the blank line its author put between
        #     `numpy` and `arm_dc_robotkit`, i.e. it asserts that the shared core is
        #     third-party. That is the same first-party judgement the step above exists to
        #     make explicit, and it is not CI's to make.
        #   * SIM105 rewrites `try/except/pass` into `contextlib.suppress` in four files
        #     that talk to a robot's motion service. Equivalent is not the same as reviewed.
        run: |
          # bash -e is GitHub's default for `run:` blocks and the loops below rely on
          # commands that exit non-zero in the good case; statuses are handled explicitly.
          set +e
          set -uo pipefail
          GRANDFATHERED=8
          uncovered=0
          for dir in $(find . -name '*.py' -not -path './.git/*' -not -path '*/__pycache__/*' \
                       -print | sed 's|/[^/]*$||' | sort -u); do
            probe="$dir"
            covered=""
            while [ "$probe" != "." ] && [ -n "$probe" ]; do
              if [ -f "$probe/ruff.toml" ]; then covered="$probe"; break; fi
              probe="$(dirname "$probe")"
            done
            [ -f "./ruff.toml" ] && covered="${covered:-.}"
            if [ -z "$covered" ]; then
              n_py="$(ls "$dir"/*.py 2>/dev/null | wc -l | tr -d ' ')"
              echo "::warning file=${dir#./}::$n_py Python file(s) here, and no ruff.toml at or above them — this directory is not linted"
              uncovered=$((uncovered + 1))
            fi
          done
          echo "$uncovered directories hold Python that no ruff.toml covers"
          if [ "$uncovered" -gt "$GRANDFATHERED" ]; then
            echo "::error::$uncovered unlinted directories, up from the $GRANDFATHERED grandfathered here. Add a ruff.toml, or raise GRANDFATHERED in this workflow and say in the PR why the code should not be linted. The comment above prices every directory that is already on the list."
            exit 1
          fi

  # ---------------------------------------------------------------------------------
  docs:
    name: AGENTS.md
    runs-on: ubuntu-22.04
    # WHAT MOVED, AND WHY THE ENFORCEMENT DID NOT GO WITH IT.
    #
    # AGENTS.md's "Before you say you are done" block used to carry a test count per
    # directory, and the suites job below re-measured every one of them. That caught real
    # drift: the block read 189 for a directory that measures 196 and 17 for one that
    # measures 60, never listed three Go2 directories or detector/labels at all, and named
    # ONE file in a directory of ten — 41 tests existed that the documented command never
    # ran. Worth keeping.
    #
    # The cost was that every change adding a test had to edit AGENTS.md, which is also the
    # file every agent edits for unrelated reasons. Two changes collided on it in one night
    # and one had to hand its count diff to the other to apply. So the numbers moved to
    # .github/test-inventory.tsv — generated by .github/measure-suites.sh, one line per
    # directory, no total line, so two changes touching different suites touch different
    # lines and neither has to do arithmetic to resolve.
    #
    # The enforcement is now two halves that meet in that file:
    #
    #   1. THIS JOB checks that AGENTS.md documents exactly the suites the inventory lists,
    #      in both directions. It compares two files in the repository and needs no
    #      interpreter, so it is seconds rather than minutes.
    #   2. The suites job re-measures the inventory itself and fails on any disagreement.
    #
    # Neither half is worth anything alone — 1 on its own is two documents agreeing about
    # a fiction — and that is exactly why 2 exists and why it runs on every pull request.
    # The list of DIRECTORIES only changes when a suite is created or deleted, which is
    # why it can stay in prose; the COUNTS changed on almost every pull request, which is
    # why they could not.
    steps:
      - uses: actions/checkout@v4

      - name: AGENTS.md documents every suite, and carries no count that can rot
        run: |
          # bash -e is GitHub's default for `run:` blocks and several commands below exit
          # non-zero in the GOOD case — a grep that finds no re-introduced count, a `comm`
          # with no lines on one side. Statuses are handled explicitly.
          set +e
          set -uo pipefail
          status=0
          T="$(mktemp -d)"

          INV=.github/test-inventory.tsv
          if [ ! -f "$INV" ]; then
            echo "::error::$INV is missing — it is generated by .github/measure-suites.sh --write"
            exit 1
          fi

          sed -n '/^## Before you say you are done$/,/^## /p' AGENTS.md > "$T/block.md"
          [ -s "$T/block.md" ] || { echo "::error file=AGENTS.md::the 'Before you say you are done' section is gone — CI parses it"; exit 1; }
          # Only the fenced commands, never the prose around them: that prose quotes old
          # counts on purpose, as the record of what drifted.
          awk '/^```bash$/{f=1;next} /^```$/{f=0} f' "$T/block.md" > "$T/fenced.sh"
          [ -s "$T/fenced.sh" ] || { echo "::error file=AGENTS.md::the block holds no fenced bash — CI parses it"; exit 1; }

          # ---- self-test: a comparison that cannot report a difference reports none ------
          # comm is the whole check. If the two sides were being fed empty files — a parser
          # that matched nothing, a column that moved — every comparison below would pass
          # silently. So run it once on a pair that is KNOWN to differ, and once on a pair
          # that is KNOWN not to.
          printf 'alpha\nbeta\n' > "$T/probe-a.txt"
          printf 'alpha\ngamma\n' > "$T/probe-b.txt"
          if [ -z "$(comm -3 "$T/probe-a.txt" "$T/probe-b.txt")" ]; then
            echo "::error::self-test: comm reported no difference between two files that differ — this job is not checking anything"
            exit 1
          fi
          if [ -n "$(comm -3 "$T/probe-a.txt" "$T/probe-a.txt")" ]; then
            echo "::error::self-test: comm reported a difference between a file and itself — this job would fail every pull request"
            exit 1
          fi
          rm -f "$T/probe-a.txt" "$T/probe-b.txt"
          echo "self-test: the comparison separates two lists that differ and clears two that do not"

          # ---- the two lists ---------------------------------------------------------------
          awk '/^\(cd /{print $2}' "$T/fenced.sh" | sort -u > "$T/documented.txt"
          awk -F'\t' '!/^#/ && NF == 2 {print $1}' "$INV" | sort -u > "$T/measured.txt"
          if [ ! -s "$T/documented.txt" ]; then
            echo "::error file=AGENTS.md::no '(cd <dir> && ...)' line parsed out of the block — a check that parses nothing passes everything"
            status=1
          fi
          if [ ! -s "$T/measured.txt" ]; then
            echo "::error file=.github/test-inventory.tsv::no '<dir><TAB><count>' line parsed out of the inventory — a check that parses nothing passes everything"
            status=1
          fi
          echo "AGENTS.md documents $(wc -l < "$T/documented.txt" | tr -d ' ') suites; the inventory lists $(wc -l < "$T/measured.txt" | tr -d ' ')"

          while IFS= read -r d; do
            [ -z "$d" ] && continue
            echo "::error file=AGENTS.md::AGENTS.md tells a reader to run tests in '$d', and the inventory records no suite there. Either the line is stale, or the suite is not being measured."
            status=1
          done < <(comm -23 "$T/documented.txt" "$T/measured.txt")

          # The direction that caught three Go2 directories and detector/labels: a suite
          # that runs and that the documented command never reaches.
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            echo "::error file=AGENTS.md::'$d' runs tests and AGENTS.md does not tell anybody to run them — add the line to the block"
            status=1
          done < <(comm -13 "$T/documented.txt" "$T/measured.txt")

          # ---- and no number may come back --------------------------------------------------
          # The counts are generated now. A hand-typed one beside a command is the thing
          # that rotted, and it would rot again in silence, because nothing downstream reads
          # it any more.
          if grep -nE '^\(cd .*#[ \t]*[0-9]+[ \t]*$' "$T/fenced.sh"; then
            echo "::error file=AGENTS.md::a per-directory test count is back in the block, on the line(s) above. Counts live in .github/test-inventory.tsv, which CI re-measures; a number here is checked by nothing."
            status=1
          fi
          if grep -nE '^#[ \t]*total[ \t]+[0-9]+' "$T/fenced.sh"; then
            echo "::error file=AGENTS.md::a total is back in the block. It was the one line every test-adding change had to rewrite, which is what made this file a merge collision."
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "AGENTS.md and .github/test-inventory.tsv name the same $(wc -l < "$T/measured.txt" | tr -d ' ') suites, and the block carries no count"
          fi
          exit $status

  # ---------------------------------------------------------------------------------
  suites:
    name: suites (Python ${{ matrix.python }} — ${{ matrix.why }})
    runs-on: ubuntu-22.04
    # TWO INTERPRETERS, BECAUSE THIS REPOSITORY GENUINELY SPANS TWO.
    #
    # 3.8 is not an oversight and must not be "fixed" upward. The Go2's Jetson runs
    # Ubuntu 20.04 / JetPack 5, policy/requirements.txt is written around the last numpy
    # that supports it (1.24.x), and every ruff.toml here sets target-version = "py38".
    # A newer interpreter would pass code the robot cannot import, and that breakage
    # surfaces on the robot, mid-run.
    #
    # 3.11 is not optional either: dashboard/ needs >= 3.11 because that is what Device
    # Connect requires, which is the entire reason dashboard/drive_bridge.py is a separate
    # 3.8 process rather than an import. One job cannot cover both, so this is a matrix.
    #
    # The two legs also resolve different numpy majors — 1.24.x on 3.8, matching the
    # robot; 2.x on 3.11, matching a workstation — and measuring both was worth doing:
    # every suite gives an identical count under each, so nothing here depends on a
    # numpy 2 behaviour change.
    #
    # ubuntu-22.04, not ubuntu-latest: 3.8 is no longer in the 24.04 tool cache.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            why: the robot's interpreter
            # dashboard/ is skipped on this leg (see skip_reason); it needs >= 3.11.
            extra_deps: ""
            authoritative: "no"
          - python: "3.11"
            why: Device Connect's floor
            extra_deps: "aiohttp"
            authoritative: "yes"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install what the offline suites import
        # INSTALLED: numpy (policy and the geometry), opencv-python-headless (headless
        # because there is no display and no test opens a window), Pillow (three tests in
        # dashboard/test_camera_source.py degrade to a printed "skip" without it — they
        # still print "ok", which is a missing dependency reading as a pass, so it is
        # installed rather than annotated), pytest (one file imports it),
        # aiohttp on the 3.11 leg only (dashboard/test_server.py, and dashboard does not
        # run on 3.8).
        #
        # NOT INSTALLED, and not installable here: device-connect-edge and
        # arm-dc-robotkit. Neither is on PyPI before launch. The two suites that need
        # them are skipped, loudly, and named in the step below with the reason.
        run: |
          python -m pip install --disable-pip-version-check --quiet --upgrade pip
          python -m pip install --disable-pip-version-check --quiet \
            numpy opencv-python-headless Pillow pytest ${{ matrix.extra_deps }}
          python - <<'EOF'
          import numpy, cv2, PIL, pytest, sys
          print(f"python {sys.version.split()[0]}  numpy {numpy.__version__}  "
                f"cv2 {cv2.__version__}  pillow {PIL.__version__}  pytest {pytest.__version__}")
          EOF

      - name: Run every test file the tree holds, and check the counts against the inventory
        # THE DISCOVERY LOOP MOVED INTO .github/measure-suites.sh, AND THAT IS THE CHANGE.
        # It used to live here, and the per-directory counts it was compared against lived
        # in AGENTS.md — so every change that added a test had to edit AGENTS.md, and two
        # changes collided on it in a single night; one had to hand its count diff to the
        # other to apply. The counts are generated into .github/test-inventory.tsv now.
        #
        # A generated file is only an improvement if a person can regenerate it. Otherwise
        # the loop becomes "push, read the CI error, paste the number", which is worse than
        # the file it replaced. So there is ONE implementation of "run every suite and count
        # the `  ok  ` lines", and CI runs the same file a person runs:
        #
        #     bash .github/measure-suites.sh --write
        #
        # A second copy of the loop living here would be the same bug as two ruff.toml files
        # that are meant to be identical and are not — which is the other half of this
        # change, and is what put eight I001 findings in front of a reader this morning.
        #
        # --check ON THE AUTHORITATIVE LEG ONLY. The 3.8 leg deliberately skips dashboard/,
        # so its inventory is shorter by construction and comparing it would be wrong. The
        # script refuses --check below 3.11 itself, and refuses it without numpy, cv2,
        # Pillow, pytest and aiohttp importable, so neither this workflow nor a person can
        # write a short inventory by accident and have it read as deleted tests. The 3.8 leg
        # still RUNS every other suite, which is the entire point of having it.
        #
        # The script asks the interpreter what version it is rather than being told by the
        # matrix: a PY that disagreed with matrix.python would silently measure the wrong
        # thing, and the two cannot disagree if only one of them is consulted.
        env:
          PY: python
          MEASURED_OUT: ${{ runner.temp }}/measured.tsv
          AUTHORITATIVE: ${{ matrix.authoritative }}
        run: |
          if [ "$AUTHORITATIVE" = "yes" ]; then
            bash .github/measure-suites.sh --check
          else
            bash .github/measure-suites.sh
          fi

      - name: Per-directory counts
        if: always()
        run: |
          # bash -e is GitHub's default for `run:` blocks and the commands below exit
          # non-zero in the good case; statuses are handled explicitly.
          set +e
          set -uo pipefail
          # An empty file here can only mean the step above already failed the job with
          # "the discovery loop found nothing" — that is the empty-loop guard, and this
          # step runs on always(), so do not double-report it as a second error.
          if [ ! -s "${{ runner.temp }}/measured.tsv" ]; then
            echo "::warning::no counts were recorded — see the step above"
            exit 0
          fi
          awk -F'\t' '!/^#/ && NF == 2 { printf "%6d  %s\n", $2, $1; t += $2 }
                      END { printf "%6d  TOTAL\n", t }' "${{ runner.temp }}/measured.tsv"
