#
# Lint settings for detector/, and — via a one-line `extend` — for detector/labels/, and
# one rule ahead of integration/ruff.toml and
# robot-stack/unitree/go2/visual_nav/ruff.toml — a second style across directories that
# are read together would be noise, and the repo has no root config to inherit. The one
# rule is FA; see the comment above `select` for what it caught and why it is here first.
#
#   ruff check . --config ruff.toml
#
# Why it exists. Until this file landed, detector/ was the one code directory in the
# repository with no ruff.toml, so the repo's own lint gate had never covered eight
# modules — including peer_recall.py, which #89 had to lint with a hand-typed
# `--select E,W,F,I,UP,B,C4,SIM,RET,RUF --line-length 100 --target-version py38` because
# there was no config to point at. A gate you have to retype is a gate that gets retyped
# differently: #78 shipped 13 findings for exactly that reason, having run a neighbouring
# directory's config.
#
# It surfaced NOTHING. Measured 2026-08-26 against `main` at 8817b9e, before this change:
# `ruff check .` from detector/ is already clean under this config and under each of
# integration/, visual_nav/, policy/ and dashboard/'s. So this is a gate, not a cleanup —
# there was no debt, only no check.
#
# detector/labels/ruff.toml is left in place deliberately, because #86 records
# `cd detector/labels && ruff check . --config ruff.toml` as the command it verified and
# that command has to keep working. It used to be a COPY of the settings below, with a
# comment in each file saying the two must not drift — and it drifted anyway: it shipped in
# #86 without the isort pin at the bottom of this file, which put eight I001 findings in
# front of the next person who pointed it at labels/pipeline/. #96 added the pin by hand.
# It is `extend = "../ruff.toml"` now instead, so there is nothing left to keep in step:
# change this file and both directories change.
line-length = 100

# The robot's Jetson runs Python 3.8 (Ubuntu 20.04 / JetPack 5). Nothing in this directory
# runs on the robot — training and evaluation happen on the Spark — but helpers move
# between here, detector/labels/ and detector/labels/pipeline/, and splitting the target
# by directory is a trap the first time one does.
target-version = "py38"

[lint]
# FA IS ONE RULE MORE THAN THE OTHER EIGHT ruff.toml FILES CARRY, AND THAT IS THE POINT.
# `target-version = "py38"` above does not mean "reject anything newer than 3.8". All it
# does to annotations is SUPPRESS UP006, the rule that rewrites `List[str]` into
# `list[str]`; no rule in the set above says the modern form is too NEW for the declared
# target. So the config silently permitted exactly the thing it was written to forbid, and
# `detector/labels/pipeline/` shipped five modules -- blobs, build, checks, p4plate, track
# -- annotated with PEP 585 builtin generics and no `from __future__ import annotations`.
# Every one raised `TypeError: 'type' object is not subscriptable` at its FIRST `def`
# under CPython 3.8.20, before any of them did a line of work; nothing noticed, because
# test_peercap.py parses those modules as source rather than importing them.
#
# FA102 is the rule that says it. The declared target is right -- CI runs a 3.8 leg over
# this directory because the Go2's Jetson is Ubuntu 20.04 / JetPack 5 -- so the missing
# thing was the check, not the target.
#
# Measured 2026-08-26 at 900788b, with the five modules fixed: `ruff check . --extend-select
# FA` is clean in all ten ruff.toml directories. Widening FA to the other eight therefore
# costs nothing and is a one-line move for whoever owns them; it is left out of this change
# because this change does not own those files.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "FA"]

[lint.per-file-ignores]
# The test modules put their own directory on sys.path before importing what they test, so
# their imports genuinely are not at the top of the file. Same idiom as the repo's other
# suites — and the reason `ruff --fix` must not be turned loose on them, per AGENTS.md.
"test_*.py" = ["E402"]

[lint.isort]
# peercap.py is a sibling MODULE, not a package, and ruff decides first-party-ness from
# isort's `src`, which is anchored at the PROJECT ROOT. Under `--config <path>` the project
# root is THE DIRECTORY YOU ARE STANDING IN, not the directory the config lives in; under
# plain discovery it is the config's own directory. Measured with ruff 0.15.21:
# `--show-settings` prints `linter.project_root = <cwd>` in the first case and
# `= <the config's directory>` in the second.
#
# So standing in labels/pipeline/, peercap is first-party and wants its own section;
# standing in detector/ or labels/, it is third-party and does not. Same config file,
# opposite verdicts -- the #78 failure in miniature. Reproduced 2026-08-26 against the
# labels config as it stood before #96: `cd detector/labels/pipeline &&
# ruff check . --config ../ruff.toml` reports eight I001 findings, and `ruff check .` from
# either documented directory reports none.
#
# WHAT THIS LINE FIXES AND WHAT IT DOES NOT. It pins ONE module, by name. Any future sibling
# module beside a subdirectory has the same problem and needs the same line, and nothing in
# ruff anchors `src` to the config's own directory to fix the class. So the fix that scales
# is not here: .github/workflows/offline-checks.yml runs every ruff.toml from every
# directory it governs, and from the repository root, and fails when two standpoints
# disagree. That gate is what would catch the next one; this line is what it enforces.
known-third-party = ["peercap"]
