#
# Lint settings for detector/labels/ — the same object as detector/ruff.toml, not a copy of
# it.
#
#   cd detector/labels && ruff check .
#   cd detector/labels && ruff check . --config ruff.toml   # what #86 recorded; still works
#
# WHY `extend` AND NOT THE SETTINGS AGAIN. Both files already said, in their own comments,
# that the two must not drift and that "a diff between them is a bug" — and then one of them
# shipped without an isort pin the other carried, and a reader who pointed this config at
# labels/pipeline/ got eight I001 findings that neither documented command produces. That
# is what a rule enforced by a comment is worth. `extend` makes the drift unrepresentable
# rather than forbidden: there is ONE set of settings, in detector/ruff.toml, and this file
# selects it. `ruff check . --show-settings` prints byte-identical linter settings for the
# two, which is the check that the two files really are one thing.
#
# The path is resolved relative to THIS FILE, not to the working directory, so it holds from
# anywhere. Kept as a file rather than deleted because #86 recorded
# `cd detector/labels && ruff check . --config ruff.toml` as the command it verified, and
# that command has to keep working.
extend = "../ruff.toml"
