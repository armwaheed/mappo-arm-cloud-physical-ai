#
# Lint settings for tools/ — small standalone utilities that are run by hand.
#
#   ruff check .
#
# Same line-length and target as the rest of the tree. target-version stays py38
# even though nothing here runs on the robot: a utility that gets copied to the
# Jetson later should not be the moment we discover it uses 3.9+ syntax.
line-length = 100
target-version = "py38"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
